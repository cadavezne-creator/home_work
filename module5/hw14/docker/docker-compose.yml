yamlversion: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hw13
    expose:
      - "8000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8080:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Монтирует файл конфигурации
    depends_on:
      - app # Запускает nginx только после старта приложения
    restart: always